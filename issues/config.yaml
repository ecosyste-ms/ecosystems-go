# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: issues
output: issues.go
generate:
  models: true
  client: true
  server-urls: true
output-options:
  skip-response-body-getters: true
  generate-types-for-anonymous-schemas: true
  # make sure that we generate /all/ types, regardless of whether they're used by our API Client or not
  skip-prune: true
  nullable-type: true
  prefer-skip-optional-pointer-on-container-types: true
  name-normalizer: ToCamelCaseWithInitialisms
  additional-initialisms:
    - IDs
    - URLs
    - PURL
    - PURLs
    - CVSS
compatibility:
  always-prefix-enum-values: true
